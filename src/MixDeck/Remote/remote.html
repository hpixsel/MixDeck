<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MixDeck</title>
<style>
  :root {
    --bg: #0E1014; --surface: #161920; --surface2: #1E222B; --track: #2A2F3B; --border: #242935;
    --text: #E8EAF0; --subtle: #8A90A0; --faint: #5D6372; --brand: #2DD4BF; --danger: #F25F5C; --warn: #F5B841;
    --accent: #A78BFA;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.35 "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  body { padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .logo { width: 28px; height: 28px; flex: none; }
  h1 { font-size: 20px; margin: 0; font-weight: 600; flex: 1; }
  .conn { font-size: 12px; color: var(--subtle); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .dot.ok { background: #3DDC97; } .dot.bad { background: var(--danger); }

  .tabs { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; margin-bottom: 12px; }
  .tab { border: 0; border-bottom: 2px solid transparent; background: var(--surface2); color: var(--text); padding: 10px 8px; border-radius: 10px; font: inherit; font-size: 14px; }
  .tab.on { border-bottom-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .tile { width: 36px; height: 36px; border-radius: 9px; flex: none; display: grid; place-items: center; font-size: 16px; font-weight: 700; }
  .name { flex: 1; min-width: 0; }
  .name b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .name small { display: block; color: var(--faint); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pct { width: 44px; text-align: right; color: var(--subtle); font-size: 13px; font-variant-numeric: tabular-nums; }
  .mute { width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--surface2); color: var(--subtle); font-size: 18px; flex: none; }
  .mute.on { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }

  .slider { position: relative; height: 44px; margin-top: 6px; touch-action: none; }
  /* the track is inset by the thumb radius so the thumb never sticks out at 0 % or 100 % */
  .slider { --v: 0; --m: 0; }
  .slider .track, .slider .fill, .slider .meter { position: absolute; left: 10px; top: 19px; height: 6px; border-radius: 3px; }
  .slider .track { right: 10px; background: var(--track); }
  .slider .fill { width: calc((100% - 20px) * var(--v) / 100); background: var(--accent); opacity: .28; }
  .slider .meter { width: calc((100% - 20px) * min(var(--m), var(--v) / 100)); background: var(--accent); transition: width 60ms linear; }
  .slider .thumb { position: absolute; top: 12px; left: calc(10px + (100% - 20px) * var(--v) / 100); width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface); }
  .muted .slider { opacity: .4; }

  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--subtle); font-weight: 600; margin: 18px 0 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--border); background: var(--surface); color: var(--text); padding: 9px 14px; border-radius: 20px; font: inherit; font-size: 14px; }
  .chip.on { border-color: var(--brand); color: var(--brand); }
  .msg { text-align: center; color: var(--subtle); padding: 40px 12px; }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset="1" stop-color="#0F766E"/></linearGradient></defs>
    <rect width="64" height="64" rx="15" fill="url(#g)"/>
    <g fill="#fff"><rect x="15.4" y="12.8" width="3.8" height="38.4" rx="1.9" opacity=".43"/><rect x="30.1" y="12.8" width="3.8" height="38.4" rx="1.9" opacity=".43"/><rect x="44.8" y="12.8" width="3.8" height="38.4" rx="1.9" opacity=".43"/>
    <rect x="10.9" y="34.6" width="12.8" height="7" rx="2.5"/><rect x="25.6" y="22.3" width="12.8" height="7" rx="2.5"/><rect x="40.3" y="29.7" width="12.8" height="7" rx="2.5"/></g>
  </svg>
  <h1>MixDeck</h1>
  <div class="conn"><div class="dot" id="dot"></div><span id="connText">connecting…</span></div>
</header>

<div id="app"><div class="msg">Connecting to MixDeck…</div></div>

<script>
"use strict";
const params = new URLSearchParams(location.search);
let token = params.get("token");
try {
  if (token) localStorage.setItem("mixdeck-token", token); else token = localStorage.getItem("mixdeck-token");
  if (params.has("token")) history.replaceState(null, "", location.pathname); // keep the token out of the address bar
} catch {}

let state = null, mixId = null, ws = null, retry = 0;
try { mixId = localStorage.getItem("mixdeck-mix"); } catch {}
const dragging = new Set();          // sliders the user is moving: ignore incoming values for them
const app = document.getElementById("app");

function connect() {
  if (!token) { app.innerHTML = '<div class="msg">No access token. Open this page via the QR code in MixDeck (Settings → Phone remote).</div>'; return; }
  ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/api/ws?token=${encodeURIComponent(token)}`);
  ws.onopen = () => { retry = 0; setConn(true); };
  ws.onclose = () => { setConn(false); setTimeout(connect, Math.min(5000, 500 * 2 ** retry++)); };
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "state") { state = msg.data; render(); }
    else if (msg.type === "levels") levels(msg.data);
  };
}

function setConn(ok) {
  document.getElementById("dot").className = "dot " + (ok ? "ok" : "bad");
  document.getElementById("connText").textContent = ok ? "connected" : "disconnected";
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render() {
  if (!state) return;
  if (!state.mixes.some(m => m.id === mixId)) mixId = state.mixes[0]?.id;
  const mix = state.mixes.find(m => m.id === mixId);
  document.documentElement.style.setProperty("--accent", mix?.accent || "#A78BFA");

  let html = '<div class="tabs">' + state.mixes.map(m =>
    `<button class="tab ${m.id === mixId ? "on" : ""}" style="--accent:${m.accent}" data-mix="${m.id}">${esc(m.name)}</button>`).join("") + "</div>";

  if (mix) html += `
    <div class="card ${mix.muted ? "muted" : ""}">
      <div class="row">
        <div class="name"><b>Whole output: ${esc(mix.name)}</b></div>
        <span class="pct" id="pct-mix">${mix.volume}%</span>
        <button class="mute ${mix.muted ? "on" : ""}" data-mute-mix="${mix.id}" aria-label="Mute output">${mix.muted ? "🔇" : "🔊"}</button>
      </div>
      ${slider("mix", mix.volume)}
    </div>`;

  html += state.channels.map(c => {
    const s = c.sends.find(x => x.mix === mixId);
    if (!s) return "";
    const off = c.muted || s.muted;
    const apps = c.apps.length ? c.apps.join(", ") : (c.kind === "system" ? "Other apps" : "");
    return `
    <div class="card ${off ? "muted" : ""}">
      <div class="row">
        <div class="tile" style="background:${c.color}2e;color:${c.color}">${esc(c.name[0] || "?")}</div>
        <div class="name"><b>${esc(c.name)}</b><small>${esc(c.muted ? "muted on all outputs" : apps)}</small></div>
        <span class="pct" id="pct-${c.id}">${s.volume}%</span>
        <button class="mute ${s.muted ? "on" : ""}" data-mute-send="${c.id}" aria-label="Mute channel">${s.muted ? "🔇" : "🔊"}</button>
      </div>
      ${slider(c.id, s.volume)}
    </div>`;
  }).join("");

  if (state.profiles.length) html += "<h2>Profiles</h2><div class=\"chips\">" + state.profiles.map(p =>
    `<button class="chip ${p.active ? "on" : ""}" data-profile="${p.id}">${esc(p.name)}</button>`).join("") + "</div>";

  // Re-render without disturbing a slider that is being dragged
  if (dragging.size) return;
  app.innerHTML = html;
  bind();
}

function slider(key, value) {
  return `<div class="slider" data-key="${key}" id="slider-${key}" style="--v:${value}"><div class="track"></div><div class="fill"></div>` +
         `<div class="meter"></div><div class="thumb"></div></div>`;
}

function bind() {
  app.querySelectorAll("[data-mix]").forEach(b => b.onclick = () => { mixId = b.dataset.mix; try { localStorage.setItem("mixdeck-mix", mixId); } catch {} render(); });
  app.querySelectorAll("[data-mute-mix]").forEach(b => b.onclick = () => {
    const m = state.mixes.find(x => x.id === b.dataset.muteMix); send({ type: "mix", mix: m.id, muted: !m.muted });
  });
  app.querySelectorAll("[data-mute-send]").forEach(b => b.onclick = () => {
    const c = state.channels.find(x => x.id === b.dataset.muteSend); const s = c.sends.find(x => x.mix === mixId);
    send({ type: "send", channel: c.id, mix: mixId, muted: !s.muted });
  });
  app.querySelectorAll("[data-profile]").forEach(b => b.onclick = () => send({ type: "profile", profile: b.dataset.profile }));
  app.querySelectorAll(".slider").forEach(el => {
    const key = el.dataset.key;
    let last = 0;
    const set = (e, final) => {
      const r = el.getBoundingClientRect();
      const v = Math.round(Math.max(0, Math.min(100, (e.clientX - r.left - 10) / (r.width - 20) * 100)));
      el.style.setProperty("--v", v);
      const pct = document.getElementById(key === "mix" ? "pct-mix" : "pct-" + key); if (pct) pct.textContent = v + "%";
      const now = performance.now();
      if (!final && now - last < 50) return; // throttle while dragging
      last = now;
      if (key === "mix") send({ type: "mix", mix: mixId, volume: v });
      else send({ type: "send", channel: key, mix: mixId, volume: v });
    };
    el.onpointerdown = e => { dragging.add(key); el.setPointerCapture(e.pointerId); set(e); };
    el.onpointermove = e => { if (dragging.has(key)) set(e); };
    el.onpointerup = el.onpointercancel = e => { if (!dragging.has(key)) return; set(e, true); dragging.delete(key); setTimeout(render, 150); };
  });
}

function levels(l) {
  for (const [k, v] of Object.entries(l.sends)) {
    const [ch, mix] = k.split("|");
    if (mix !== mixId) continue;
    const s = document.getElementById("slider-" + ch); if (s) s.style.setProperty("--m", v);
  }
  const ms = document.getElementById("slider-mix"); if (ms && l.mixes[mixId] !== undefined) ms.style.setProperty("--m", l.mixes[mixId]);
}

connect();
</script>
</body>
</html>
